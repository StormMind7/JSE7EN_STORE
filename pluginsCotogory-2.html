<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plugin Category Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #111115;
    --bg3: #18181e;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #e8e6f0;
    --muted: #6b6880;
    --accent: #7c6af7;
    --accent2: #c084fc;
    --accent3: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* HEADER */
  header {
    padding: 60px 40px 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .logo-area h1 {
    font-family: var(--mono);
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 700;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #e8e6f0 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .logo-area p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    font-family: var(--mono);
    letter-spacing: 0.5px;
  }

  .stats-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* SEARCH + FILTER BAR */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,12,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 40px;
  }

  .toolbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 9px 12px 9px 36px;
    outline: none;
    transition: border-color .2s;
  }

  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .expand-btn, .collapse-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 9px 14px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }

  .expand-btn:hover, .collapse-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .count-badge {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 9px 14px;
    white-space: nowrap;
  }

  /* MAIN GRID */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 40px 80px;
    position: relative;
    z-index: 1;
  }

  /* CATEGORY CARD */
  .cat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color .2s;
  }

  .cat-card:hover { border-color: var(--border-hover); }
  .cat-card.hidden { display: none; }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }

  .cat-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }

  .cat-name {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    letter-spacing: -0.2px;
  }

  .plugin-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--bg3);
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
  }

  /* COPY BUTTON */
  .copy-cat-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .copy-cat-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .copy-cat-btn.copied {
    border-color: var(--green);
    color: var(--green);
  }

  .chevron {
    font-size: 10px;
    color: var(--muted);
    transition: transform .25s;
    flex-shrink: 0;
  }

  .chevron.open { transform: rotate(90deg); }

  /* PLUGIN BODY */
  .cat-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
  }

  .cat-body.open { display: block; }

  .cat-body-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .vendor-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .vendor-tab {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }

  .vendor-tab:hover, .vendor-tab.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,247,0.08);
  }

  .plugin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
  }

  .plugin-item {
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    transition: border-color .15s;
  }

  .plugin-item:hover { border-color: var(--border-hover); }
  .plugin-item.highlight { border-color: var(--accent2); background: rgba(192,132,252,0.06); }

  .plugin-name { flex: 1; line-height: 1.3; }

  .vendor-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* VENDOR COLORS */
  .vd-waves { background: #38bdf8; }
  .vd-fabfilter { background: #c084fc; }
  .vd-imageline { background: #34d399; }
  .vd-soundtoys { background: #fbbf24; }
  .vd-valhalla { background: #f87171; }
  .vd-antares { background: #fb923c; }
  .vd-other { background: #94a3b8; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    padding: 14px 20px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* COLOR ACCENTS PER CATEGORY */
  .cat-01 .cat-num { background: rgba(248,113,113,0.15); color: #f87171; }
  .cat-02 .cat-num { background: rgba(56,189,248,0.15); color: #38bdf8; }

  .cat-14 .cat-num { background: rgba(253,164,175,0.15); color: #fda4af; }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 14px;
    display: none;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
</style>
</head>

const vendorMap = {
  waves:"Waves", fabfilter:"FabFilter", imageline:"Image-Line",
  soundtoys:"Soundtoys", valhalla:"Valhalla DSP", antares:"Antares", other:"Other"
};

function vendorDotClass(v) {
  return "vendor-dot vd-" + v;
}

function buildCards() {
  const container = document.getElementById('cats');
  container.innerHTML = '';
  data.forEach((cat, idx) => {
    const card = document.createElement('div');
    card.className = `cat-card ${cat.cls}`;
    card.id = `card-${idx}`;

    const vendors = [...new Set(cat.plugins.map(p => p.v))];

    card.innerHTML = `
      <div class="cat-header" onclick="toggleCard(${idx})">
        <span class="cat-num">${cat.num}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="plugin-count" id="count-${idx}">${cat.plugins.length}</span>
        <button class="copy-cat-btn" id="copybtn-${idx}" onclick="copyCategory(event, ${idx})" title="Copy all plugin names">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          COPY
        </button>
        <span class="chevron" id="chev-${idx}">▶</span>
      </div>
      <div class="cat-body" id="body-${idx}">
        <div class="cat-body-header">
          <div class="vendor-tabs" id="vtabs-${idx}">
            <span class="vendor-tab active" onclick="filterVendor(event, ${idx}, 'all')">All</span>
            ${vendors.map(v => `<span class="vendor-tab" onclick="filterVendor(event, ${idx}, '${v}')">${vendorMap[v]||v}</span>`).join('')}
          </div>
        </div>
        <div class="plugin-grid" id="grid-${idx}">
          ${cat.plugins.map((p,pi) => `
            <div class="plugin-item" data-vendor="${p.v}" data-idx="${pi}" id="plug-${idx}-${pi}">
              <span class="plugin-name">${p.n}</span>
              <span class="${vendorDotClass(p.v)}" title="${vendorMap[p.v]||p.v}"></span>
            </div>
          `).join('')}
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function toggleCard(idx) {
  const body = document.getElementById(`body-${idx}`);
  const chev = document.getElementById(`chev-${idx}`);
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
}

function expandAll() {
  data.forEach((_, idx) => {
    const card = document.getElementById(`card-${idx}`);
    if (!card.classList.contains('hidden')) {
      document.getElementById(`body-${idx}`).classList.add('open');
      document.getElementById(`chev-${idx}`).classList.add('open');
    }
  });
}

function collapseAll() {
  data.forEach((_, idx) => {
    document.getElementById(`body-${idx}`).classList.remove('open');
    document.getElementById(`chev-${idx}`).classList.remove('open');
  });
}

function filterVendor(e, idx, vendor) {
  e.stopPropagation();
  document.querySelectorAll(`#vtabs-${idx} .vendor-tab`).forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll(`#grid-${idx} .plugin-item`).forEach(el => {
    el.style.display = (vendor === 'all' || el.dataset.vendor === vendor) ? '' : 'none';
  });
}

function copyCategory(e, idx) {
  e.stopPropagation();
  const cat = data[idx];
  const text = `${cat.num} - ${cat.name}\n${'─'.repeat(30)}\n${cat.plugins.map(p => p.n).join('\n')}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`copybtn-${idx}`);
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> COPIED!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> COPY`;
    }, 2000);
  });
}

function doSearch(q) {
  q = q.toLowerCase().trim();
  let total = 0;
  let showing = 0;
  data.forEach((cat, idx) => {
    const card = document.getElementById(`card-${idx}`);
    let catMatch = 0;
    cat.plugins.forEach((p, pi) => {
      const el = document.getElementById(`plug-${idx}-${pi}`);
      const match = !q || p.n.toLowerCase().includes(q)
        || cat.name.toLowerCase().includes(q)
        || (vendorMap[p.v]||'').toLowerCase().includes(q);
      el.classList.toggle('highlight', !!q && match);
      el.style.display = '';
      if (match) catMatch++;
      total++;
    });
    if (q) {
      // show/hide based on match
      let hasAny = cat.plugins.some(p =>
        p.n.toLowerCase().includes(q) ||
        cat.name.toLowerCase().includes(q) ||
        (vendorMap[p.v]||'').toLowerCase().includes(q)
      );
      card.classList.toggle('hidden', !hasAny);
      if (hasAny) {
        document.getElementById(`body-${idx}`).classList.add('open');
        document.getElementById(`chev-${idx}`).classList.add('open');
        showing += catMatch;
      }
    } else {
      card.classList.remove('hidden');
      showing = total;
    }
    document.getElementById(`count-${idx}`).textContent = q ? catMatch : cat.plugins.length;
  });

  const badge = document.getElementById('match-badge');
  const nr = document.getElementById('no-results');
  if (q) {
    badge.textContent = `${showing} match`;
    const anyVisible = data.some((cat, idx) => !document.getElementById(`card-${idx}`).classList.contains('hidden'));
    nr.style.display = anyVisible ? 'none' : 'block';
  } else {
    badge.textContent = `All 424`;
    nr.style.display = 'none';
  }
}
